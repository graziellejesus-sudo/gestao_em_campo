
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - Gestão em Campo</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/Perfil.css">

</head>

<body>

    <!-- ================================= -->
    <!-- MENU LATERAL -->
    <!-- ================================= -->

    <aside class="menu-lateral">

        <!-- LOGO -->

        <div class="logo-area">

            <img
                src="../img/img.png"
                alt="Logo Gestão em Campo"
            >
            <span>
            </span>

        </div>

        <!-- MENU DE NAVEGAÇÃO -->

        <nav>

            <a href="inicio.html">
                Início
            </a>

            <a href="Painel escala.html">
                Escalas
            </a>

            <a href="Solicitacao.html">
                Solicitações
            </a>

            <a href="Perfil.html" class="ativo">
                Meu Perfil
            </a>

            <a href="login.html">
                Sair
            </a>

        </nav>

    </aside>

    <!-- ================================= -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ================================= -->

    <main class="conteudo">


        <!-- TÍTULO -->

        <div class="titulo">

            <h1>
                Meu Perfil
            </h1>

            <p>
                Gerencie as informações do seu perfil.
            </p>

        </div>

        <!-- ================================= -->
        <!-- CARD DO PERFIL -->
        <!-- ================================= -->

        <section class="perfil">

            <!-- CABEÇALHO DO PERFIL -->

            <div class="perfil-cabecalho">

                <!-- ÍCONE -->

                <div class="icone-perfil">
                    👤
                </div>

                <!-- TÍTULO -->

                <div>

                    <h2>
                        Perfil do usuário
                    </h2>

                    <p>
                        Atualize suas informações abaixo.
                    </p>

                </div>

            </div>

            <!-- LINHA SEPARADORA -->

            <div class="linha"></div>


            <!-- ================================= -->
            <!-- FORMULÁRIO -->
            <!-- ================================= -->

            <form id="formPerfil">

                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                    >

                </div>

                <!-- E-MAIL -->

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>

                <!-- CARGO -->

                <div class="campo">

                    <label for="cargo">
                        Cargo
                    </label>

                    <select
                        id="cargo"
                        name="cargo"
                    >

                        <option value="">
                            Selecione seu cargo
                        </option>

                        <option value="Gestão">
                            Gestão
                        </option>

                        <option value="Funcionário">
                            Funcionário
                        </option>

                    </select>

                </div>

                <!-- ================================= -->
                <!-- BOTÕES -->
                <!-- ================================= -->

                <div class="botoes">


                    <!-- BOTÃO CANCELAR -->

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="cancelar()"
                    >
                        Cancelar
                    </button>

                    <!-- BOTÃO SALVAR -->

                    <button
                        type="submit"
                        class="btn-salvar"
                    >
                        Sair
                    </button>

                </div>


            </form>

        </section>

    </main>

    <script src="../js/Perfil.js"></script>

</body>

</html>
