

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitação de Escala - Gestão em Campo</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/Solicitacao.css">

</head>

<body>

    <!-- ================================= -->
    <!-- MENU LATERAL -->
    <!-- ================================= -->

    <aside class="menu-lateral">

        <!-- LOGO -->
        <div class="logo-area">

            <img
                src="../img/img.png"
                alt="Logo Gestão em Campo"
            >

            <span>
            </span>

        </div>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav>

            <a href="inicio.html">
                Início
            </a>

            <a href="Painel escala.html">
                Escalas
            </a>

            <a href="Solicitacao.html" class="ativo">
                Solicitações
            </a>

            <a href="perfil.html">
                Meu Perfil
            </a>

            <a href="login.html">
                Sair
            </a>

        </nav>

    </aside>

    <!-- ================================= -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ================================= -->

    <main class="conteudo">

        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <h1>
                Solicitação de Escala
            </h1>

            <p>
                Preencha os dados abaixo para enviar sua solicitação.
            </p>

        </header>

        <!-- ================================= -->
        <!-- CARD DO FORMULÁRIO -->
        <!-- ================================= -->

        <section class="card">

            <h2>
                Nova Solicitação
            </h2>

            <!-- FORMULÁRIO -->

            <form id="formSolicitacao">

                <!-- TIPO DA SOLICITAÇÃO -->

                <div class="campo">

                    <label for="tipo">
                        Tipo de solicitação
                    </label>

                    <select
                        id="tipo"
                        name="tipo"
                        required
                    >

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option value="folga">
                            Solicitação de Folga
                        </option>

                        <option value="troca">
                            Troca de Escala
                        </option>

                        <option value="alteracao">
                            Alteração de Escala
                        </option>

                    </select>

                </div>

                <!-- DATA DE INÍCIO -->

                <div class="campo">

                    <label for="dataInicio">
                        Data de início
                    </label>

                    <input
                        type="date"
                        id="dataInicio"
                        name="dataInicio"
                        required
                    >

                </div>

                <!-- DATA DE FIM -->

                <div class="campo">

                    <label for="dataFim">
                        Data de fim
                    </label>

                    <input
                        type="date"
                        id="dataFim"
                        name="dataFim"
                        required
                    >

                </div>

                <!-- MOTIVO -->

                <div class="campo">

                    <label for="motivo">
                        Motivo da solicitação
                    </label>

                    <textarea
                        id="motivo"
                        name="motivo"
                        rows="5"
                        placeholder="Digite o motivo da sua solicitação..."
                        required
                    ></textarea>

                </div>

                <!-- ================================= -->
                <!-- BOTÕES -->
                <!-- ================================= -->

                <div class="botoes">

                    <button
                        type="reset"
                        class="btn-cancelar"
                    >
                        Limpar
                    </button>

                    <button
                        type="submit"
                        class="btn-enviar"
                    >
                        Enviar solicitação
                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="../js/solicitacao.js"></script>

</body>

</html>
